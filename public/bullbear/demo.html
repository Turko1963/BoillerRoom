<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BullBear component demo</title>
<link rel="stylesheet" href="bullbear.css">
<style>
  html,body{height:100%;margin:0}
  body{background:radial-gradient(ellipse 70% 70% at 50% 40%,#141C3A,#050811 75%);color:#EEF2FA;font:15px/1.45 system-ui,sans-serif;display:flex;flex-direction:column}
  header{padding:18px 22px 6px}h1{font-size:20px;margin:0 0 4px}p{margin:0;color:#A9B4CA}
  .ctl{display:flex;flex-wrap:wrap;gap:8px;padding:12px 22px}
  button{font:inherit;color:#EEF2FA;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:8px 13px;cursor:pointer}
  button:hover{background:rgba(255,255,255,.12)}
  #stage{position:relative;flex:1;min-height:320px;margin:0 22px;border:1px dashed rgba(255,255,255,.14);border-radius:18px;overflow:hidden}
  #stage span{position:absolute;left:14px;top:10px;color:#66728C;font-size:13px}
  #dock{padding:16px 22px 20px}
</style></head>
<body>
<header><h1>BullBear component demo</h1><p>The strip at the bottom is the arena. The dashed area plays the intro fight.</p></header>
<div class="ctl">
  <button data-a="bull">Bull scores</button><button data-a="bear">Bear scores</button><button data-a="neutral">Neutral</button>
  <button data-a="b70">Balance 70 / 30</button><button data-a="b30">Balance 30 / 70</button>
  <button data-a="endbull">End: bulls win</button><button data-a="endbear">End: bears win</button><button data-a="draw">End: draw</button>
  <button data-a="reset">Reset</button><button data-a="intro">Play intro fight</button>
</div>
<div id="stage"><span>Intro fight stage</span></div>
<div id="dock"></div>
<script src="bullbear.js"></script>
<!-- pictures are served from assets/ -->
<script>
  const arena = BullBear.createArena(document.getElementById('dock'), { isDark: () => true });
  let intro = null;
  document.querySelector('.ctl').onclick = e => {
    const a = e.target.dataset.a; if (!a) return;
    if (a === 'bull') arena.hit('bull', 'Technical Analyst scores for the bulls');
    if (a === 'bear') arena.hit('bear', 'Filings Specialist swings for the bears');
    if (a === 'neutral') arena.hit('neutral', 'Dealer sits on the fence');
    if (a === 'b70') arena.setVotes({ bull: 70, bear: 30 });
    if (a === 'b30') arena.setVotes({ bull: 30, bear: 70 });
    if (a === 'endbull') arena.end('bull');
    if (a === 'endbear') arena.end('bear');
    if (a === 'draw') arena.end('draw');
    if (a === 'reset') arena.reset('The bell rings');
    if (a === 'intro') { if (intro) intro.destroy(); intro = BullBear.createIntroFight(document.getElementById('stage'), {
      onKnockout: () => console.log('knockout'), onVictory: () => console.log('victory'), onFinish: (x, y) => console.log('finish at', x, y) }); }
  };
</script>
</body></html>
