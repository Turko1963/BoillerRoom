<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boiler Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Geist:wght@400..700&display=swap" rel="stylesheet">
<style>
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
:root{
  --bg:#EDF0F7; --bg-a:#FFFFFF; --bg-b:#E4E8F3; --glass:rgba(255,255,255,.74); --glass-2:rgba(15,23,40,.045);
  --ink:#0D1424; --ink-2:#46516A; --ink-3:#8590A6; --line:rgba(15,23,40,.10); --accent:#5B46E8; --accent-ink:#fff;
  --up:#0E9468; --down:#D63A55; --shadow:0 1px 1px rgba(15,23,40,.05),0 24px 60px -24px rgba(30,40,90,.30);
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Geist","Inter","Segoe UI",system-ui,sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#050811; --bg-a:#141C3A; --bg-b:#050811; --glass:rgba(14,20,38,.62); --glass-2:rgba(255,255,255,.05);
  --ink:#EEF2FA; --ink-2:#A9B4CA; --ink-3:#66728C; --line:rgba(255,255,255,.09); --accent:#9A8BFF; --accent-ink:#070A14;
  --up:#3DD9A4; --down:#FF6177; --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 30px 70px -30px rgba(0,0,0,.9); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#050811; --bg-a:#141C3A; --bg-b:#050811; --glass:rgba(14,20,38,.62); --glass-2:rgba(255,255,255,.05);
  --ink:#EEF2FA; --ink-2:#A9B4CA; --ink-3:#66728C; --line:rgba(255,255,255,.09); --accent:#9A8BFF; --accent-ink:#070A14;
  --up:#3DD9A4; --down:#FF6177; --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 30px 70px -30px rgba(0,0,0,.9); color-scheme:dark}
*,*::before,*::after{box-sizing:inherit;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{position:relative;height:100%;display:grid;grid-template-rows:auto auto 1fr;min-height:0;
  background:radial-gradient(ellipse 70% 70% at 50% 46%,var(--bg-a),var(--bg-b) 75%);transition:background .5s}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);-webkit-backdrop-filter:blur(22px) saturate(1.3);backdrop-filter:blur(22px) saturate(1.3)}

.top{position:relative;display:flex;align-items:center;gap:14px;padding:14px 20px 0}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.035em;display:flex;align-items:center;gap:10px}
.brand i{width:11px;height:11px;border-radius:50%;background:linear-gradient(135deg,#FF9A3D,#FF5FA2 55%,#8C7BFF);box-shadow:0 0 18px 2px rgba(255,95,162,.6)}
.sp{flex:1}
.pill{font-size:12.5px;color:var(--ink-2);border:1px solid var(--line);border-radius:99px;padding:4px 11px;display:flex;align-items:center;gap:7px;background:var(--glass-2)}
.pill u{width:7px;height:7px;border-radius:50%;background:var(--up);box-shadow:0 0 0 3px color-mix(in srgb,var(--up) 25%,transparent)}
.mode{position:relative;display:flex;padding:3px;border-radius:13px;border:1px solid var(--line);background:var(--glass-2)}
.mode i{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:10px;background:linear-gradient(120deg,#FF9A3D,#FF5FA2);box-shadow:0 6px 18px -6px #FF5FA2;transition:transform .5s cubic-bezier(.3,1.5,.4,1),box-shadow .4s}
.mode i::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(120deg,#4F8DFF,#8C7BFF);opacity:0;transition:opacity .4s}
.mode[data-m="investor"] i{transform:translateX(100%);box-shadow:0 6px 18px -6px #8C7BFF}
.mode[data-m="investor"] i::after{opacity:1}
.mode button{position:relative;width:104px;height:32px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:13.5px;color:var(--ink-2);transition:color .3s}
.mode button[aria-checked="true"]{color:#fff}
.mode button .i{font-size:15px}
.brain i{width:calc(33.333% - 2px);background:linear-gradient(120deg,#35D6A0,#2FC8E8);box-shadow:0 6px 18px -6px #2FC8E8}
.brain i::after{display:none}
.brain[data-m="claude"] i{transform:translateX(100%);background:linear-gradient(120deg,#E8875F,#D9622B);box-shadow:0 6px 18px -6px #D9622B}
.brain[data-m="gemini"] i{transform:translateX(200%);background:linear-gradient(120deg,#4F8DFF,#8C7BFF);box-shadow:0 6px 18px -6px #4F8DFF}
.brain button{width:78px}
.brain button.off{opacity:.42;cursor:not-allowed}
.brain[hidden]{display:none}
.desk .lead{position:absolute;left:calc(50% + 16px);top:-3px;font-size:10.5px;font-weight:700;line-height:1;padding:3px 7px;border-radius:99px;background:var(--hue);color:#0A0F1E;scale:0;transition:scale .5s cubic-bezier(.2,1.8,.4,1);z-index:1}
.desk.lead .lead{scale:1}
.clock{font-size:14px;color:var(--ink-2);min-width:74px;text-align:right}
.theme{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--glass-2);display:grid;place-items:center;font-size:17px;transition:transform .4s}
.theme:hover{transform:rotate(30deg)}
.theme .moon{display:none}
:root[data-theme="dark"] .theme .sun{display:none}
:root[data-theme="dark"] .theme .moon{display:block}

.tape{position:relative;margin:12px 20px 0;height:36px;border-radius:13px;overflow:hidden;display:flex;align-items:center;border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.tape .lbl{flex:none;height:100%;display:flex;align-items:center;gap:8px;padding:0 14px;font-family:var(--display);font-weight:700;font-size:13px;border-right:1px solid var(--line);position:relative;z-index:1;background:var(--glass)}
.tape .lbl i{width:7px;height:7px;border-radius:50%;background:var(--down);animation:antb 1.2s ease-in-out infinite}
.tape .win{flex:1;overflow:hidden;height:100%;-webkit-mask-image:linear-gradient(90deg,transparent,#000 40px,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(90deg,transparent,#000 40px,#000 calc(100% - 40px),transparent)}
.track{display:flex;align-items:center;width:max-content;height:100%;animation:tape 80s linear infinite}
.tape:hover .track{animation-play-state:paused}
@keyframes tape{to{transform:translateX(-50%)}}
.grp{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;border:1px solid currentColor;margin:0 10px 0 18px;white-space:nowrap}
.tk-i{display:flex;align-items:center;gap:8px;padding:0 13px;height:28px;border-radius:9px;font-size:13px;white-space:nowrap;transition:background .25s,box-shadow .25s}
.tk-i:hover{background:var(--glass-2)}
.tk-i b{font-weight:700;color:var(--ink)}
.tk-i .tp{color:var(--ink-2);transition:color .6s}
.tk-i .tp.f{color:currentColor;transition:none}
.tk-i svg{width:34px;height:14px;overflow:visible}
.tk-i polyline{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tk-i.scan{background:color-mix(in srgb,var(--accent) 30%,transparent);box-shadow:inset 0 0 0 1px var(--accent)}
.tk-i.pick{background:color-mix(in srgb,#FF9A3D 30%,transparent);box-shadow:inset 0 0 0 1.5px #FF9A3D,0 0 18px -2px #FF9A3D}

/* the scout rocket */
.scout{position:absolute;left:4px;bottom:calc(var(--cmdh,150px) + 16px);width:128px;z-index:7;display:flex;flex-direction:column;align-items:center;gap:0;text-align:center}
.rk{display:block;width:52px;height:96px;will-change:transform;filter:drop-shadow(0 8px 16px rgba(255,120,80,.45))}
.rk svg{display:block;width:100%;height:100%;overflow:visible;animation:hover 3s ease-in-out infinite alternate}
.rk .fl{transform-box:fill-box;transform-origin:50% 0;animation:flame .12s ease-in-out infinite alternate;scale:1 .4;transition:scale .3s}
.scout:hover .rk .fl{scale:1 .8}
.scout.fly .rk svg{animation:none}
.scout.fly .rk .fl{scale:1 1.5}
.rk .pe{transform-box:fill-box;transform-origin:center;animation:blink 3.6s infinite}
.scout .pad{display:block;margin-top:-6px;padding:5px 10px 6px;border-radius:13px;background:var(--glass);border:1px solid var(--line);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:border-color .3s}
.scout:hover .pad{border-color:#FF9A3D}
.scout .pad b{display:block;font-family:var(--display);font-weight:700;font-size:13px}
.scout .pad small{display:block;font-size:11.5px;color:var(--ink-3);line-height:1.25}
.scout.fly .pad small{color:#FF9A3D}
@keyframes hover{from{transform:translateY(2px)}to{transform:translateY(-5px)}}
@keyframes flame{from{transform:scaleX(.82)}to{transform:scaleX(1.12) scaleY(1.15)}}
.found{position:absolute;left:0;top:0;width:250px;padding:14px 16px 15px;border-radius:20px;text-align:center;z-index:8;pointer-events:none;transform:translate(-50%,-50%);scale:.5;opacity:0;
  background:color-mix(in srgb,var(--bg) 88%,#FF9A3D);border:1px solid #FF9A3D;box-shadow:0 0 60px -10px #FF9A3D;transition:opacity .3s,scale .6s cubic-bezier(.2,1.7,.3,1)}
.found.on{opacity:1;scale:1}
.found small{display:block;font-size:12.5px;font-weight:600;color:#FF9A3D}
.found b{display:block;font-family:var(--display);font-weight:800;font-size:42px;letter-spacing:-.04em;line-height:1.05}
.found span{display:block;font-size:13px;color:var(--ink-2)}
.found em{display:block;font-style:normal;font-size:12.5px;color:var(--ink-3);margin-top:6px}

.body{position:relative;display:grid;grid-template-columns:288px minmax(0,1fr) 360px;gap:16px;padding:14px 20px 20px;min-height:0}

/* market */
.mkt{padding:18px;display:flex;flex-direction:column;gap:14px;min-height:0;overflow:auto}
.mk-h{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.tk{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.04em;line-height:1}
.co{font-size:13px;color:var(--ink-3);margin-top:4px}
.px{text-align:right}
.px b{font-size:21px;font-weight:600;display:block;line-height:1.1;transition:color .5s}
.px b.fu{color:var(--up);transition:none}.px b.fd{color:var(--down);transition:none}
.px small{font-size:13px}
.u{color:var(--up)}.d{color:var(--down)}
#chart{width:100%;height:176px;display:block;flex:none}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{border-radius:14px;background:var(--glass-2);padding:9px 12px;min-height:68px;position:relative;overflow:hidden;transition:box-shadow .5s}
.tile:last-child{grid-column:1/-1}
.tile small{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-3)}
.tile small i{width:7px;height:7px;border-radius:50%;background:var(--hue)}
.tile strong{display:block;font-family:var(--display);font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.tile span{font-size:12px;color:var(--ink-2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .sk{display:block;height:14px;width:62%;border-radius:6px;margin-top:10px;background:linear-gradient(90deg,var(--glass-2),var(--line),var(--glass-2));background-size:200% 100%;animation:sk 1.6s linear infinite}
.tile.on{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--hue) 55%,transparent),0 0 26px -8px var(--hue)}
@keyframes sk{to{background-position:-200% 0}}

/* stage */
.stage{position:relative;min-height:0}
.desk{position:absolute;left:0;top:0;width:162px;height:122px;display:flex;flex-direction:column;align-items:center;gap:4px;opacity:0;scale:.5;transition:opacity .6s,scale .7s cubic-bezier(.2,1.6,.4,1);will-change:transform}
.desk.on{opacity:1;scale:1}
.desk:hover{z-index:3}
.desk:hover .bot{transform:translateY(-5px) scale(1.1)}
.tag{position:relative;display:block;width:162px;max-width:100%;padding:4px 10px 7px;border-radius:13px;text-align:center;background:var(--glass);border:1px solid var(--line);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:border-color .3s}
.tag b{display:block;font-family:var(--display);font-weight:650;font-size:13px;letter-spacing:-.015em;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag .st{display:block;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:17px}
.tag .br{position:absolute;left:12px;right:12px;bottom:3px;height:2px;border-radius:2px;overflow:hidden}
.tag .br i{display:block;height:100%;width:0;background:var(--hue);border-radius:2px}
.desk:not([data-state="idle"]) .tag{border-color:color-mix(in srgb,var(--hue) 50%,transparent)}
.desk[data-state="working"] .st,.desk[data-state="exec"] .st{color:var(--ink-2)}
.desk[data-state="working"] .tag::before,.desk[data-state="exec"] .tag::before,.cmd.busy::before{content:"";position:absolute;inset:-1.5px;border-radius:inherit;padding:1.5px;pointer-events:none;
  background:conic-gradient(from var(--ang),transparent 0 62%,var(--hue,var(--accent)));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:rot 1.5s linear infinite}
@keyframes rot{to{--ang:360deg}}
.desk[data-stance="bull"] .st{color:var(--up);font-weight:600}
.desk[data-stance="bear"] .st{color:var(--down);font-weight:600}
.desk[data-stance="neutral"] .st{color:var(--ink-2);font-weight:600}

/* bot faces */
.bot{display:block;flex:none;width:72px;height:72px;--eye:color-mix(in srgb,var(--hue) 22%,#fff);transition:transform .35s cubic-bezier(.2,1.5,.4,1),filter .5s;
  filter:drop-shadow(0 5px 10px color-mix(in srgb,var(--hue) 35%,transparent))}
.bot svg{display:block;width:100%;height:100%;overflow:visible;transform-origin:50% 90%}
.bot .scr{fill:#0A0F1E}
.bot .acc{fill:color-mix(in srgb,var(--hue) 60%,#000)}
.bot .accs{fill:none;stroke:color-mix(in srgb,var(--hue) 60%,#000);stroke-width:3;stroke-linecap:round}
.bot .rim{fill:none;stroke:var(--eye);stroke-width:1.6;opacity:.75}
.bot .ant{fill:var(--eye);animation:antb 2.4s ease-in-out infinite var(--bd,0s)}
.bot .eo{fill:var(--eye);transform-box:fill-box;transform-origin:center;transition:transform .25s;animation:blink 4.2s infinite var(--bd,0s)}
.bot .eh,.bot .es,.bot .mo{fill:none;stroke:var(--eye);stroke-width:2.2;stroke-linecap:round}
.bot .eh,.bot .es,.bot .m-smile,.bot .m-frown,.bot .m-talk{display:none}
.bot .m-talk rect{fill:var(--eye);transform-box:fill-box;transform-origin:center;animation:talk .42s ease-in-out infinite alternate}
.bot .m-talk rect:nth-child(2){animation-delay:-.2s}.bot .m-talk rect:nth-child(3){animation-delay:-.33s}
.bot .eyes{transform:translate(calc(var(--lx,0)*1px),calc(var(--ly,0)*1px))}
.bot[data-mood="awake"]{filter:drop-shadow(0 6px 16px color-mix(in srgb,var(--hue) 75%,transparent))}
.bot[data-mood="awake"] svg{animation:hop .5s cubic-bezier(.3,1.6,.5,1)}
.bot[data-mood="awake"] .eo{transform:scale(1.3)}
.bot[data-mood="work"]{filter:drop-shadow(0 6px 18px color-mix(in srgb,var(--hue) 85%,transparent))}
.bot[data-mood="work"] svg{animation:nod 1s ease-in-out infinite alternate}
.bot[data-mood="work"] .eyes{animation:scan 1.2s ease-in-out infinite alternate}
.bot[data-mood="work"] .eo{animation:none;transform:scaleY(.72)}
.bot[data-mood="work"] .ant{animation:antb .35s steps(2) infinite}
.bot[data-mood="work"] .m-flat{display:none}.bot[data-mood="work"] .m-talk{display:block}
.bot[data-mood="bull"] svg{animation:hop .7s cubic-bezier(.3,1.6,.5,1) 2}
.bot[data-mood="bull"] .eo{display:none}.bot[data-mood="bull"] .eh{display:block}
.bot[data-mood="bull"] .m-flat{display:none}.bot[data-mood="bull"] .m-smile{display:block}
.bot[data-mood="bear"] svg{animation:shake .5s ease-in-out}
.bot[data-mood="bear"] .es{display:block}.bot[data-mood="bear"] .eo{animation:none;transform:scale(.8,.62)}
.bot[data-mood="bear"] .m-flat{display:none}.bot[data-mood="bear"] .m-frown{display:block}
.bot[data-mood="neutral"] .eo{animation:none;transform:scaleY(.42)}
.bot[data-mood="talk"]{filter:drop-shadow(0 6px 18px color-mix(in srgb,var(--hue) 85%,transparent))}
.bot[data-mood="talk"] svg{animation:nod .8s ease-in-out infinite alternate}
.bot[data-mood="talk"] .m-flat{display:none}.bot[data-mood="talk"] .m-talk{display:block}
.bot[data-mood="talk"] .eo{animation:none}
.bot[data-mood="listen"] svg{transform:rotate(-6deg)}
.bot[data-mood="listen"] .eo{animation:none;transform:scale(1.22)}
.bub{--bb:color-mix(in srgb,var(--hue) 65%,transparent);position:absolute;left:0;top:0;width:204px;padding:8px 12px 9px;border-radius:14px;z-index:6;pointer-events:none;
  background:color-mix(in srgb,var(--bg) 84%,var(--hue));border:1px solid var(--bb);box-shadow:0 14px 34px -12px var(--hue);opacity:0;transition:opacity .25s}
.bub.on{opacity:1}
.bub small{display:block;font-size:11.5px;font-weight:600;color:color-mix(in srgb,var(--hue) 70%,var(--ink))}
.bub p{font-size:13px;line-height:1.35;color:var(--ink);min-height:18px}
.bub::after{content:"";position:absolute;left:calc(var(--tx,102px) - 6px);bottom:-6.5px;width:11px;height:11px;rotate:45deg;background:inherit;border-right:1px solid var(--bb);border-bottom:1px solid var(--bb)}
.bub.dn::after{bottom:auto;top:-6.5px;border:0;border-left:1px solid var(--bb);border-top:1px solid var(--bb)}
.tally{display:flex;gap:14px;justify-content:center;font-weight:700;font-size:15px;margin-top:5px}
.tally[hidden]{display:none}
.msg header small{font-weight:400;color:var(--ink-3);font-size:13px}
.msg header span{white-space:nowrap}
.chg{padding-left:18px;color:var(--ink-2);font-size:14px;display:grid;gap:4px}
@keyframes blink{0%,93%,100%{scale:1 1}96%{scale:1 .1}}
@keyframes antb{50%{opacity:.25}}
@keyframes talk{from{transform:scaleY(.25)}to{transform:scaleY(1.25)}}
@keyframes scan{from{transform:translate(-2.6px,.6px)}to{transform:translate(2.6px,.6px)}}
@keyframes nod{from{transform:rotate(-4deg)}to{transform:rotate(4deg) translateY(-1.5px)}}
@keyframes hop{35%{transform:translateY(-9px) scale(1.06,.96)}70%{transform:translateY(0) scale(.97,1.04)}}
@keyframes shake{20%,60%{transform:translateX(-3px) rotate(-3deg)}40%,80%{transform:translateX(3px) rotate(3deg)}}

.core{position:absolute;left:0;top:0;width:0;height:0;z-index:2}
.core button{position:absolute;width:calc(var(--R,80px)*2);height:calc(var(--R,80px)*2);left:calc(var(--R,80px)*-1);top:calc(var(--R,80px)*-1);border-radius:50%}
.core .cw{position:absolute;left:0;top:0;transform:translate(-50%,-50%);text-align:center;pointer-events:none;white-space:nowrap;opacity:0;scale:.5;transition:opacity .5s,scale .7s cubic-bezier(.2,1.6,.3,1)}
.core.called .cw{opacity:1;scale:1}
.core .cw::before{content:"";position:absolute;inset:-26px -44px;z-index:-1;background:radial-gradient(closest-side,var(--bg) 35%,transparent);opacity:.8}
.core .call{font-family:var(--display);font-weight:800;font-size:46px;letter-spacing:-.05em;line-height:.95;text-shadow:0 2px 30px var(--bg)}
.core .cv{font-size:13px;font-weight:600;color:var(--ink);text-shadow:0 1px 12px var(--bg)}
.core .lb{position:absolute;left:0;top:calc(var(--R,80px) + 26px);transform:translateX(-50%);text-align:center;width:250px;pointer-events:none}
.core .who{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:-.01em}
.core .cst{font-size:13px;color:var(--ink-2);min-height:19px}

.cmd{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(620px,100%);padding:10px;border-radius:24px;z-index:4}
.cmd form{display:flex;gap:8px}
.cmd input{flex:1;min-width:0;height:50px;border-radius:15px;border:1px solid transparent;background:var(--glass-2);padding:0 16px;font-size:16px;transition:.25s}
.cmd input::placeholder{color:var(--ink-3)}
.cmd input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
.go{height:50px;padding:0 22px;border-radius:15px;font-weight:600;white-space:nowrap;color:#fff;background:linear-gradient(120deg,#6A5BFF,#C24BD6 55%,#FF7A4D);background-size:180% 100%;
  box-shadow:0 10px 30px -10px rgba(194,75,214,.7);transition:background-position .5s,transform .15s,opacity .2s;text-align:center}
.go:hover{background-position:100% 0;transform:translateY(-1px)}.go:active{transform:scale(.97)}
.go:disabled{opacity:.55;cursor:default;transform:none}
.ex{display:flex;flex-wrap:wrap;gap:6px;padding:8px 4px 0}
.ex button{font-size:12.5px;color:var(--ink-2);border:1px solid var(--line);border-radius:99px;padding:4px 11px;transition:.2s}
.ex button:hover{color:var(--ink);border-color:var(--ink-3);background:var(--glass-2)}

/* side */
.side{display:flex;flex-direction:column;min-height:0;overflow:hidden;position:relative}
.tabs{display:flex;gap:4px;padding:10px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;height:38px;border-radius:12px;font-weight:600;color:var(--ink-3);text-align:center;transition:.2s}
.tabs button[aria-selected="true"]{background:var(--glass-2);color:var(--ink)}
.tabs .dot{display:none;width:7px;height:7px;border-radius:50%;background:#FF7A4D;margin-left:6px;vertical-align:middle;box-shadow:0 0 10px #FF7A4D}
.tabs .new .dot{display:inline-block}
.pane{flex:1;overflow:auto;padding:14px 18px 20px;min-height:0;scrollbar-width:thin}
.pane[hidden]{display:none}
.empty{color:var(--ink-3);padding:44px 10px;text-align:center;max-width:30ch;margin:auto}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:18px;margin-bottom:6px}
.msg{display:grid;grid-template-columns:3px 1fr;gap:2px 12px;padding:10px 0;animation:msg .5s cubic-bezier(.2,.9,.3,1)}
.msg i{grid-row:1/3;border-radius:3px;background:var(--hue);box-shadow:0 0 12px var(--hue)}
.msg header{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.msg header b{font-weight:600}.msg header span{color:var(--ink-3)}
.msg p{font-size:14px;color:var(--ink-2);min-height:20px}
@keyframes msg{from{opacity:0;transform:translateY(12px)}}

.vd{display:flex;align-items:center;gap:16px}
.vd svg{width:92px;height:92px;flex:none;transform:rotate(-90deg)}
.vd circle{fill:none;stroke-width:7}
.vd .t{stroke:var(--glass-2)}.vd .p{stroke:currentColor;stroke-linecap:round;stroke-dasharray:239;stroke-dashoffset:239;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)}
.vd .rg{position:relative;flex:none}
.vd .rg em{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:20px;color:var(--ink)}
.verdict{font-family:var(--display);font-weight:800;font-size:40px;letter-spacing:-.045em;line-height:1}
.vsub{color:var(--ink-3);font-size:13px;margin-top:5px}
.why{color:var(--ink-2);margin:16px 0 4px;font-size:14.5px}
h3{font-family:var(--display);font-size:15px;font-weight:650;margin:18px 0 8px}
.votes{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.votes button{height:48px;border-radius:9px;background:var(--glass-2);position:relative;overflow:hidden;animation:vt .5s backwards cubic-bezier(.2,1.4,.4,1)}
.votes button::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--hue)}
.votes .bot{width:32px;height:32px;margin:5px auto 0;filter:none}
@keyframes vt{from{opacity:0;transform:translateY(14px)}}
.vleg{font-size:12.5px;color:var(--ink-3);margin-top:6px}
.ticket{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ticket div{padding:9px 12px;border-bottom:1px solid var(--line)}
.ticket div:nth-child(odd){border-right:1px solid var(--line)}
.ticket div:nth-last-child(-n+2){border-bottom:0}
.ticket small{display:block;color:var(--ink-3);font-size:12.5px}
.ticket strong{font-weight:600}
.acts{display:flex;gap:8px;margin-top:16px}
.acts .go{flex:1;height:46px;padding:0 10px}
.ghost{flex:1;height:46px;border-radius:15px;border:1px solid var(--line);font-weight:600;text-align:center}
.ghost:hover{border-color:var(--ink-3)}
.fill{height:6px;border-radius:6px;background:var(--glass-2);margin-top:12px;overflow:hidden;display:none}
.fill i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FFB23E,#FF7A4D);border-radius:6px;transition:width .6s}

.sheet{position:absolute;inset:0;background:var(--glass);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);z-index:5;padding:20px;overflow:auto;border-radius:inherit;transform:translateX(104%);transition:transform .5s cubic-bezier(.2,.9,.2,1);visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sheet .x{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:11px;border:1px solid var(--line);display:grid;place-items:center}
.sheet .hd{display:flex;gap:14px;align-items:center;margin-bottom:14px;padding-right:44px}
.sheet .hd .bot{width:68px;height:68px}
.sheet .hd .mi{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:25px;color:#fff;background:var(--hue);box-shadow:0 0 30px -4px var(--hue);flex:none}
.sheet h2{font-family:var(--display);font-size:23px;letter-spacing:-.02em;line-height:1.1}
.sheet .does{color:var(--ink-2)}
.tools{display:flex;flex-wrap:wrap;gap:6px}
.tools span{font-size:13px;border:1px solid var(--line);border-radius:8px;padding:3px 9px;color:var(--ink-2)}
.rep{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--glass-2)}
.rep .hl{font-weight:600;margin:6px 0 10px}
.rep ul{padding-left:18px;color:var(--ink-2);font-size:14px;display:grid;gap:6px}
.conf{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-3);margin-top:12px}
.conf div{flex:1;height:5px;border-radius:5px;background:var(--line);overflow:hidden}
.conf div i{display:block;height:100%;background:var(--hue);border-radius:5px}
.s-bull{color:var(--up)}.s-bear{color:var(--down)}.s-neutral{color:var(--ink-2)}

.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:13px;font-weight:500;font-size:14px;pointer-events:none;transition:.45s cubic-bezier(.2,1.2,.4,1);z-index:20}
.toast.on{transform:translate(-50%,0);opacity:1}

@media (max-height:800px){.ex{display:none}}
@media (max-width:1399px){.body{grid-template-columns:minmax(0,1fr) 360px}.mkt{display:none}}
@media (max-width:900px){
  html,body{height:auto}body{overflow:auto}
  .app{height:auto;display:block}
  .pill,.clock{display:none}.top{gap:8px;flex-wrap:wrap}.mode button{width:88px}.brain button{width:66px}
  .body{display:block;padding:0 12px 16px}
  .stage{padding-top:330px}
  .desk,.desk.on{position:relative;transform:none!important;width:auto;height:auto;scale:1}
  #desks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  #desks .desk:last-child{grid-column:1/-1}
  .cmd{position:sticky;bottom:10px;left:auto;transform:none;width:auto;margin-top:12px}
  .bub{display:none}.tape{margin:10px 12px 0}.tape .lbl{padding:0 10px}.scout{left:auto;right:0;top:206px;bottom:auto;width:104px}.scout .pad small{display:none}.cmd form{flex-direction:column}.cmd input{flex:none}.ex{display:none}
  .side{margin-top:14px;min-height:480px}
  .sheet{position:fixed;border-radius:0}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}

/* ================= the scout: finds the next big opportunity on the tape ================= */
let scanI=-1;
function scanAt(k){const i=Math.min(MOV.length-1,Math.floor(k*MOV.length));if(i===scanI)return;scanI=i;document.querySelectorAll('.tk-i.scan').forEach(e=>e.classList.remove('scan'));
  tapeEls(MOV[i].k).forEach(e=>e.classList.add('scan'));$('#scoutl').textContent='Scanning '+MOV[i].k}
function launch(){
  if(running||fly){toast('The room is busy. Wait for the decision');return}
  if(!MOV.length){toast('Market data is not loaded yet');return}
  running=true;$('#go').disabled=true;$('#go').textContent='Scout is flying';closeSheet();hush();
  document.querySelectorAll('.tk-i.pick').forEach(e=>e.classList.remove('pick'));$('#found').classList.remove('on');
  const r=rk.getBoundingClientRect(),fr=fx.getBoundingClientRect(),hx=r.left+r.width/2-fr.left,hy=r.top+r.height/2-fr.top,kx=G.mobile?104:G.rx*.6,ky=G.mobile?104:G.ry*.6;
  fly={t0:performance.now(),hx,hy,rot:0,a0:Math.atan2((hy-G.cy)/ky,(hx-G.cx)/kx)};scanI=-1;scout.classList.add('fly');RING.forEach(id=>{look[id]='rocket';mood(id,'awake')});
  actT=1.2;coreEl.classList.remove('called');vcol=null;pT=0;$('#tally').hidden=true;mgr('The scout is scanning today’s movers');

function land(){
  fly=null;rk.style.transform='';scout.classList.remove('fly');delete dpos.rocket;for(const k in look)delete look[k];RING.forEach(id=>mood(id,'idle'));
  document.querySelectorAll('.tk-i.scan').forEach(e=>e.classList.remove('scan'));

  running=false;$('#go').disabled=false;$('#go').textContent='Brief the room';$('#cmd').classList.remove('busy');
}
$('#form').onsubmit=e=>{e.preventDefault();const v=$('#q').value.trim();if(!v){$('#q').focus();toast('Type a brief first, for example a ticker and a question');return}if(!running)run(v)};

function renderMemo(){
  const d=data,cls=d.call==='Buy'?'s-bull':d.call==='Short'?'s-bear':'s-neutral',sym={bull:'▲',bear:'▼',neutral:'●'};
  $('#memo').innerHTML=`
    <div class="vd ${cls}"><div class="rg"><svg viewBox="0 0 92 92"><circle class="t" cx="46" cy="46" r="38"/><circle class="p" id="ringp" cx="46" cy="46" r="38"/></svg><em id="ringn">0</em></div>
      <div><div class="verdict">${d.callLabel}${d.tk?' '+d.tk:''}</div><div class="vsub">${d.name?d.name+', ':''}last ${usd(d.p)}</div><div class="vsub">${d.modeName} mode, ${d.hz}</div>${d.brain&&d.brain.id!=='rules'?`<div class="vsub">Brain: ${d.brain.label}, ${d.brain.model}</div>`:''}</div></div>
    <p class="why">${esc(d.why)}</p>
    <h3>How the desks voted</h3>
    <div class="votes">${RING.map((id,i)=>`<button data-id="${id}" title="${AG[id].name}: ${LAB[d.R[id].stance]}" aria-label="${AG[id].name}: ${LAB[d.R[id].stance]}" style="--hue:${AG[id].hue};animation-delay:${i*70}ms">${bot(id,d.R[id].stance)}</button>`).join('')}</div>
    <div class="vleg">${d.tally.bull} buy, ${d.tally.neutral} hold, ${d.tally.bear} ${d.sell}. Votes are weighted by confidence and by mode. Tap a bot to read its report.</div>
    <h3>What the debate changed</h3>${d.changes.length?`<ul class="chg">${d.changes.map(x=>`<li>${x}</li>`).join('')}</ul>`:'<div class="vleg">Nobody changed position.</div>'}
    ${d.ticket?`<h3>Trade ticket</h3><div class="ticket">${Object.entries(d.ticket).map(([k,v])=>`<div><small>${k}</small><strong>${v}</strong></div>`).join('')}</div><div class="fill" id="fill"><i></i></div>`:''}
    <div class="acts">${d.ticket?'<button class="go" id="approve">Approve ticket</button>':''}<button class="ghost" id="again">Run again</button></div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{$('#ringp').style.strokeDashoffset=239*(1-d.conv/100);count($('#ringn'),d.conv,v=>Math.round(v)+'%',1400)}));
}
async function execute(btn){
  const my=runId;btn.disabled=true;btn.textContent='Sending the ticket';
  /* POST /api/rounds/:id/execute fills the paper order on the server; here we replay the fills slice by slice */
  let o;try{o=await API.execute(data.id)}catch(e){if(e.status===409&&e.body.order)o=e.body.order;else{btn.disabled=false;btn.textContent='Approve ticket';toast(e.message);return}}
  if(my!==runId)return;const n=o.fills.length,f=$('#fill');btn.textContent='Dealer is working the order';f.style.display='block';
  const d=D('dealer');delete d.dataset.stance;setState('dealer','exec');wire('dealer',`Ticket approved. Working ${n} slices.`);
  for(let i=1;i<=n;i++){if(my!==runId)return;setSt('dealer',`Slice ${i} of ${n} at ${usd(o.fills[i-1].price)}`);spawn('dealer',-1,10);
    d.querySelector('.br i').style.width=f.firstChild.style.width=i/n*100+'%';await sleep(1100)}
  if(my!==runId)return;const avg=usd(o.avgPrice);d.dataset.stance='bull';setState('dealer','done');setSt('dealer','Filled at '+avg);
  btn.textContent='Filled at '+avg;wire('dealer',`All ${n} slices filled. Average price ${avg}.`);burst=.5;shock(AG.dealer.rgb);toast('Order filled at an average of '+avg);
}
$('#memo').onclick=e=>{
  const v=e.target.closest('.votes button');if(v)return openSheet(v.dataset.id);
  if(e.target.id==='again'){const q=$('#q').value.trim()||EX[0];if(!running)run(q+' ')}
  if(e.target.id==='approve')execute(e.target);
};

/* ================= desk detail ================= */
const sheet=$('#sheet');
function openSheet(id){
  openId=id;const a=AG[id],rp=data&&reported.has(id)&&data.R[id];let body;
  if(id==='manager')body=data&&vcol?`<div class="rep"><div class="hl">${data.callLabel}${data.tk?' '+data.tk:''} at ${data.conv}% conviction</div><p style="color:var(--ink-2);font-size:14px">${esc(data.why)}</p></div>`
    :'<div class="rep" style="color:var(--ink-3)">No decision yet. Brief the room to get one.</div>';
  else body=rp?`<div class="rep"><b class="s-${rp.stance}">${LAB[rp.stance]}</b><div class="hl">${rp.headline}</div><ul>${rp.findings.map(f=>`<li>${f}</li>`).join('')}</ul>
      ${rp.sources?`<p class="vsub">Data: ${rp.sources.join(', ')}${rp.ai?`. Written by ${data.brain.label}`:''}</p>`:''}<div class="conf"><span>Confidence</span><div><i style="width:${rp.conf}%"></i></div><span>${rp.conf}%</span></div></div>`
    :`<div class="rep" style="color:var(--ink-3)">${state[id]==='working'?'Working on it. The report shows up here as soon as it is filed.':'No report yet. Brief the room to put this desk to work.'}</div>`;
  sheet.style.setProperty('--hue',a.hue);
  sheet.innerHTML=`<button class="x" aria-label="Close">✕</button><div class="hd">${id==='manager'?`<span class="mi">${ico(a.icon)}</span>`:bot(id,rp?rp.stance:state[id]==='working'||state[id]==='exec'?'work':'idle')}<h2>${a.name}</h2></div>
    <p class="does">${a.does}</p>${id==='manager'?'':`<p class="vsub">Vote weight in ${MODES[mode].name} mode: ${MODES[mode].w[id]}x</p>`}<h3>Works with</h3><div class="tools">${a.tools.map(t=>`<span>${t}</span>`).join('')}</div>
    <h3>${id==='manager'?'Latest decision':'Latest report'}</h3>${body}`;
  sheet.classList.add('open');
}
function closeSheet(){openId=null;sheet.classList.remove('open')}
sheet.onclick=e=>{if(e.target.closest('.x'))closeSheet()};
stage.onclick=e=>{const n=e.target.closest('[data-id]');if(n)openSheet(n.dataset.id)};

/* ================= boot ================= */
{let m='trader';try{m=localStorage.getItem('br-mode')==='investor'?'investor':'trader'}catch(e){}setMode(m,1)}
/* ask the server which data it serves, then load the tape and chart; refresh live data */
API.req("/health").then(h=>{LIVE=h.market!=="demo";setMode(mode,1);initBrains(h.brains);
  $("#src").textContent=LIVE?"Live data: Yahoo Finance, Binance, SEC. Paper trading only":"Demo data, fictional companies";
  const loadTape=()=>API.movers().then(m=>{if(running||fly)return;MOV=m;buildTape()});
  loadTape().catch(e=>toast("Could not load market data: "+e.message));
  loadChart(LIVE?"SPY":"HLXN").catch(e=>toast("Could not load the chart: "+e.message));
  if(LIVE){setInterval(()=>loadTape().catch(()=>{}),60000);
    setInterval(()=>{const k=$("#tk").textContent;if(document.hidden||!k||k==="Target"||running)return;
      API.chart(k).then(d=>{if($("#tk").textContent!==k)return;chart.c=d.candles;chart.open=d.open;showPx(0)}).catch(()=>{})},30000)}
}).catch(e=>{$("#src").textContent="Server offline";toast("Could not reach the server: "+e.message)});resize();requestAnimationFrame(t=>{last=t;frame(t)});
RING.forEach((id,i)=>setTimeout(()=>{D(id).classList.add('on');spawn(id,1,10)},500+i*130));
burst=.9;
})();
</script>
