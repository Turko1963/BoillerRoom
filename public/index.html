<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>BackStage Capital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Geist:wght@400..700&display=swap" rel="stylesheet">
<style>
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
:root{
  --bg:#EDF0F7; --bg-a:#FFFFFF; --bg-b:#E4E8F3; --glass:rgba(255,255,255,.74); --glass-2:rgba(15,23,40,.045);
  --ink:#0D1424; --ink-2:#46516A; --ink-3:#8590A6; --line:rgba(15,23,40,.10); --accent:#5B46E8; --accent-ink:#fff;
  --up:#0E9468; --down:#D63A55; --shadow:0 1px 1px rgba(15,23,40,.05),0 24px 60px -24px rgba(30,40,90,.30);
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Geist","Inter","Segoe UI",system-ui,sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#050811; --bg-a:#141C3A; --bg-b:#050811; --glass:rgba(14,20,38,.62); --glass-2:rgba(255,255,255,.05);
  --ink:#EEF2FA; --ink-2:#A9B4CA; --ink-3:#66728C; --line:rgba(255,255,255,.09); --accent:#9A8BFF; --accent-ink:#070A14;
  --up:#3DD9A4; --down:#FF6177; --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 30px 70px -30px rgba(0,0,0,.9); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#050811; --bg-a:#141C3A; --bg-b:#050811; --glass:rgba(14,20,38,.62); --glass-2:rgba(255,255,255,.05);
  --ink:#EEF2FA; --ink-2:#A9B4CA; --ink-3:#66728C; --line:rgba(255,255,255,.09); --accent:#9A8BFF; --accent-ink:#070A14;
  --up:#3DD9A4; --down:#FF6177; --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 30px 70px -30px rgba(0,0,0,.9); color-scheme:dark}
*,*::before,*::after{box-sizing:inherit;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bot{display:block;flex:none;width:72px;height:72px;--eye:color-mix(in srgb,var(--hue) 22%,#fff);transition:transform .35s cubic-bezier(.2,1.5,.4,1),filter .5s;
  filter:drop-shadow(0 5px 10px color-mix(in srgb,var(--hue) 35%,transparent))}
.bot svg{display:block;width:100%;height:100%;overflow:visible;transform-origin:50% 90%}
.bot .scr{fill:#0A0F1E}
.bot .acc{fill:color-mix(in srgb,var(--hue) 60%,#000)}
.bot .accs{fill:none;stroke:color-mix(in srgb,var(--hue) 60%,#000);stroke-width:3;stroke-linecap:round}
.bot .rim{fill:none;stroke:var(--eye);stroke-width:1.6;opacity:.75}
.bot .ant{fill:var(--eye);animation:antb 2.4s ease-in-out infinite var(--bd,0s)}
.bot .eo{fill:var(--eye);transform-box:fill-box;transform-origin:center;transition:transform .25s;animation:blink 4.2s infinite var(--bd,0s)}
.bot .eh,.bot .es,.bot .mo{fill:none;stroke:var(--eye);stroke-width:2.2;stroke-linecap:round}
.bot .eh,.bot .es,.bot .m-smile,.bot .m-frown,.bot .m-talk{display:none}
.bot .m-talk rect{fill:var(--eye);transform-box:fill-box;transform-origin:center;animation:talk .42s ease-in-out infinite alternate}
.bot .m-talk rect:nth-child(2){animation-delay:-.2s}.bot .m-talk rect:nth-child(3){animation-delay:-.33s}
.bot .eyes{transform:translate(calc(var(--lx,0)*1px),calc(var(--ly,0)*1px))}
.bot[data-mood="awake"]{filter:drop-shadow(0 6px 16px color-mix(in srgb,var(--hue) 75%,transparent))}
.bot[data-mood="awake"] svg{animation:hop .5s cubic-bezier(.3,1.6,.5,1)}
.bot[data-mood="awake"] .eo{transform:scale(1.3)}
.bot[data-mood="work"]{filter:drop-shadow(0 6px 18px color-mix(in srgb,var(--hue) 85%,transparent))}
.bot[data-mood="work"] svg{animation:nod 1s ease-in-out infinite alternate}
.bot[data-mood="work"] .eyes{animation:scan 1.2s ease-in-out infinite alternate}
.bot[data-mood="work"] .eo{animation:none;transform:scaleY(.72)}
.bot[data-mood="work"] .ant{animation:antb .35s steps(2) infinite}
.bot[data-mood="work"] .m-flat{display:none}.bot[data-mood="work"] .m-talk{display:block}
.bot[data-mood="bull"] svg{animation:hop .7s cubic-bezier(.3,1.6,.5,1) 2}
.bot[data-mood="bull"] .eo{display:none}.bot[data-mood="bull"] .eh{display:block}
.bot[data-mood="bull"] .m-flat{display:none}.bot[data-mood="bull"] .m-smile{display:block}
.bot[data-mood="bear"] svg{animation:shake .5s ease-in-out}
.bot[data-mood="bear"] .es{display:block}.bot[data-mood="bear"] .eo{animation:none;transform:scale(.8,.62)}
.bot[data-mood="bear"] .m-flat{display:none}.bot[data-mood="bear"] .m-frown{display:block}
.bot[data-mood="neutral"] .eo{animation:none;transform:scaleY(.42)}
.bot[data-mood="talk"]{filter:drop-shadow(0 6px 18px color-mix(in srgb,var(--hue) 85%,transparent))}
.bot[data-mood="talk"] svg{animation:nod .8s ease-in-out infinite alternate}
.bot[data-mood="talk"] .m-flat{display:none}.bot[data-mood="talk"] .m-talk{display:block}
.bot[data-mood="talk"] .eo{animation:none}
.bot[data-mood="listen"] svg{transform:rotate(-6deg)}
.bot[data-mood="listen"] .eo{animation:none;transform:scale(1.22)}
@keyframes blink{0%,93%,100%{scale:1 1}96%{scale:1 .1}}
@keyframes antb{50%{opacity:.25}}
@keyframes talk{from{transform:scaleY(.25)}to{transform:scaleY(1.25)}}
@keyframes scan{from{transform:translate(-2.6px,.6px)}to{transform:translate(2.6px,.6px)}}
@keyframes nod{from{transform:rotate(-4deg)}to{transform:rotate(4deg) translateY(-1.5px)}}
@keyframes hop{35%{transform:translateY(-9px) scale(1.06,.96)}70%{transform:translateY(0) scale(.97,1.04)}}
@keyframes shake{20%,60%{transform:translateX(-3px) rotate(-3deg)}40%,80%{transform:translateX(3px) rotate(3deg)}}
.gate .bot{width:46px;height:46px}
/* BackStage Capital: intro and members gate (always dark) */
@property --ir{syntax:'<length>';initial-value:0px;inherits:true}
.gate{position:fixed;inset:0;z-index:100;background:#04060C;color:#EEF2FA;overflow:hidden;--ir:0px}
#ic{position:absolute;inset:0;width:100%;height:100%}
.g-cap{position:absolute;left:0;right:0;bottom:15%;text-align:center;font-family:var(--display);font-size:clamp(19px,2.5vw,32px);font-weight:500;letter-spacing:-.015em;color:#C9D2E6;padding:0 24px;min-height:1.3em;transition:opacity .7s}
.g-logo{position:absolute;left:50%;top:50%;translate:-50% -50%;text-align:center;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 1s,top 1.2s cubic-bezier(.6,0,.2,1),scale 1.2s cubic-bezier(.6,0,.2,1)}
.g-logo.on{opacity:1}
.g-logo .l1{font-family:var(--display);font-weight:800;font-size:var(--fs,120px);line-height:1;letter-spacing:-.045em;background:linear-gradient(100deg,#fff 42%,#FFC98A 50%,#fff 58%) 100% 0/300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.g-logo.on .l1{animation:shine 2.4s ease-in-out .7s both}
@keyframes shine{from{background-position:100% 0}to{background-position:0 0}}
.g-logo .l2{font-family:var(--display);font-weight:500;font-size:calc(var(--fs,120px)*.3);line-height:1;letter-spacing:.5em;padding-left:.5em;margin-top:calc(var(--fs,120px)*.12);background:linear-gradient(90deg,#FF9A3D,#FF5FA2,#8C7BFF);-webkit-background-clip:text;background-clip:text;color:transparent}
.g-logo .l3{position:absolute;left:50%;top:calc(100% + var(--fs,120px)*.36);translate:-50% 0;font-size:clamp(14px,1.5vw,19px);color:#A9B4CA;opacity:0;transition:opacity .9s}
.g-logo.tl .l3{opacity:1}
.gate.locked .g-logo{top:15%;scale:.42}
.gate.locked .g-logo .l3{opacity:0}
.g-card{position:absolute;left:50%;top:58%;translate:-50% -42%;width:min(92vw,450px);padding:24px 26px 22px;border-radius:28px;text-align:center;background:rgba(14,20,38,.62);border:1px solid rgba(255,255,255,.1);
  -webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:0 40px 100px -30px #000;opacity:0;visibility:hidden;transition:opacity .9s .55s,translate .9s .55s cubic-bezier(.2,.9,.2,1),visibility 0s .55s}
.gate.locked .g-card{opacity:1;visibility:visible;translate:-50% -50%}
.g-bots{display:flex;justify-content:center;margin-bottom:14px}
.g-bots .bot{width:46px;height:46px;margin:0 -2px}
.g-card h1{font-family:var(--display);font-weight:800;font-size:36px;letter-spacing:-.04em;line-height:1.05}
.g-card p{color:#A9B4CA;font-size:15px;margin:8px auto 20px;max-width:34ch}
.pin{display:flex;justify-content:center;gap:clamp(5px,1.6vw,9px)}
.pin input{width:clamp(38px,11vw,52px);height:62px;border-radius:15px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);text-align:center;font-size:26px;font-weight:700;color:#fff;caret-color:#FF9A3D;padding:0;transition:border-color .2s,background .2s,box-shadow .2s}
.pin input:focus{outline:0;border-color:#FF9A3D;box-shadow:0 0 0 4px rgba(255,154,61,.22),0 0 30px -6px #FF9A3D}
.pin.no{animation:shake .45s ease-in-out}
.pin.no input{border-color:#FF6177;background:rgba(255,97,119,.14)}
.pin input.ok{border-color:#3DD9A4;background:rgba(61,217,164,.18);box-shadow:0 0 26px -6px #3DD9A4;animation:hop .5s cubic-bezier(.3,1.6,.5,1)}
.g-msg{margin-top:16px;font-size:13.5px;color:#7C88A3;min-height:20px}
.g-msg.no{color:#FF6177}.g-msg.ok{color:#3DD9A4;font-weight:600}
.g-skip{position:absolute;right:22px;bottom:calc(20px + env(safe-area-inset-bottom,0px));font-size:13px;color:#8590A6;padding:8px 14px;border-radius:99px;border:1px solid rgba(255,255,255,.12);opacity:0;transition:opacity .6s,color .2s}
.g-skip.on{opacity:1}.g-skip:hover{color:#fff}
.gate.locked .g-skip{opacity:0;pointer-events:none}
.gate.open{-webkit-mask:radial-gradient(circle at var(--ix,50%) var(--iy,50%),transparent var(--ir),#000 calc(var(--ir) + 2px));mask:radial-gradient(circle at var(--ix,50%) var(--iy,50%),transparent var(--ir),#000 calc(var(--ir) + 2px));animation:iris 1.7s cubic-bezier(.6,0,.35,1) forwards}
.gate.open::after{content:"";position:absolute;left:var(--ix,50%);top:var(--iy,50%);width:calc(var(--ir)*2 + 10px);height:calc(var(--ir)*2 + 10px);translate:-50% -50%;border-radius:50%;border:5px solid #FF9A3D;box-shadow:0 0 60px 10px rgba(255,154,61,.75)}
.gate.open .g-card,.gate.open .g-logo{opacity:0;transition:opacity .45s}
@keyframes iris{to{--ir:78vmax}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="gate" id="gate">
  <canvas id="ic" aria-hidden="true"></canvas>
  <div class="g-cap" id="gcap"></div>
  <div class="g-logo" id="glogo"><div class="l1">BackStage</div><div class="l2">Capital</div><div class="l3">Private desk. Invited members only.</div></div>
  <form class="g-card" id="gcard" autocomplete="off">
    <div class="g-bots" id="gbots"></div>
    <h1>Friends only.</h1>
    <p>Seven friends are waiting inside. Enter your six digit code to join them.</p>
    <div class="pin" id="pin"><input type="password" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Digit 1 of 6"><input type="password" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Digit 2 of 6"><input type="password" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Digit 3 of 6"><input type="password" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Digit 4 of 6"><input type="password" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Digit 5 of 6"><input type="password" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Digit 6 of 6"></div>
    <div class="g-msg" id="gmsg" aria-live="polite">Invitation only</div>
  </form>
  <button class="g-skip" id="gskip" type="button">Skip intro</button>
</div>
<script>
(function(){
/* BackStage Capital: the public intro and members gate. The code is checked on the server. */
const $=s=>document.querySelector(s),root=document.documentElement;
root.dataset.theme='dark';
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const RING=['analyst','filings','fundamental','risk','dealer','ma','technical'];
const AG={analyst:{hue:'#5B9BFF'},filings:{hue:'#A583FF'},fundamental:{hue:'#35D6A0'},risk:{hue:'#FF6B5E'},dealer:{hue:'#FFB23E'},ma:{hue:'#F472D0'},technical:{hue:'#2FC8E8'}};
const BOT={
  analyst:{back:'<path class="accs" d="M32 12V6"/><circle class="ant" cx="32" cy="5" r="3.2"/><circle class="acc" cx="8" cy="35" r="4.5"/><circle class="acc" cx="56" cy="35" r="4.5"/>',
    head:'<circle cx="32" cy="35" r="23"/>',scr:'<rect class="scr" x="15" y="25" width="34" height="21" rx="10.5"/>',eyes:[[25,33,'c',3.6],[39,33,'c',3.6]],mouth:[32,40.5,3.4]},
  filings:{back:'<rect class="acc" x="27" y="6" width="10" height="8" rx="2"/><circle class="ant" cx="32" cy="9" r="1.8"/>',
    head:'<rect x="9" y="13" width="46" height="44" rx="10"/>',scr:'<rect class="scr" x="13" y="20" width="38" height="30" rx="7"/>',eyes:[[23,32,'c',3],[41,32,'c',3]],mouth:[32,44,3.6],
    front:'<circle class="rim" cx="23" cy="32" r="7.4"/><circle class="rim" cx="41" cy="32" r="7.4"/><path class="rim" d="M30.4 32h3.2"/>'},
  fundamental:{back:'<path class="accs" d="M32 10V5"/><circle class="ant" cx="32" cy="4.5" r="2.6"/><rect class="acc" x="7" y="27" width="7" height="13" rx="2.5"/><rect class="acc" x="50" y="27" width="7" height="13" rx="2.5"/>',
    head:'<rect x="13" y="10" width="38" height="48" rx="8"/>',scr:'<rect class="scr" x="17" y="17" width="30" height="15" rx="4.5"/><rect class="scr" x="20" y="38" width="24" height="13" rx="4"/>',eyes:[[25,24.5,'s',3],[39,24.5,'s',3]],mouth:[32,44.5,4.2]},
  risk:{back:'<path class="acc" d="M10 20 3 16v14l7 4zM54 20l7-4v14l-7 4z"/>',
    head:'<path d="M32 6 54 14v19c0 13-10 21-22 26C20 54 10 46 10 33V14z"/>',scr:'<rect class="scr" x="17" y="20" width="30" height="17" rx="8.5"/><rect class="scr" x="24" y="42" width="16" height="9" rx="4.5"/>',eyes:[[32,28.5,'c',5]],mouth:[32,46.5,3.2]},
  dealer:{back:'<path class="accs" d="M11 26C11 5 53 5 53 26" style="stroke-width:4"/><rect class="acc" x="3" y="27" width="9" height="15" rx="4"/><rect class="acc" x="52" y="27" width="9" height="15" rx="4"/>',
    head:'<rect x="8" y="17" width="48" height="37" rx="18.5"/>',scr:'<rect class="scr" x="15" y="24" width="34" height="22" rx="11"/>',eyes:[[25,32.5,'p',3.2],[39,32.5,'p',3.2]],mouth:[32,41,3.6],
    front:'<path class="accs" d="M7 42c1 8 7 11 14 11" style="stroke-width:2.4"/><circle class="acc" cx="22" cy="53" r="3"/>'},
  ma:{back:'<path class="accs" d="M21 13V7"/><circle class="ant" cx="21" cy="6" r="2.6"/><path class="accs" d="M43 16v-6"/><rect class="ant" x="40.5" y="6.5" width="5" height="5" rx="1"/>',
    head:'<path d="M32 12H21A11 11 0 0 0 10 23v21a11 11 0 0 0 11 11h11z"/><path d="M32 15h11a11 11 0 0 1 11 11v21a11 11 0 0 1-11 11H32z" style="fill:color-mix(in srgb,var(--hue) 55%,#8C7BFF)"/>',
    scr:'<rect class="scr" x="15" y="24" width="34" height="23" rx="7"/>',eyes:[[24,33,'c',3.6],[40,34,'s',3.2]],mouth:[32,42,3.6]},
  technical:{back:'<path class="accs" d="M23 14 19 6M41 14l4-8"/><circle class="ant" cx="18.5" cy="5" r="2.5"/><circle class="ant" cx="45.5" cy="5" r="2.5"/>',
    head:'<path d="M32 8 54 20v26L32 58 10 46V20z" stroke-linejoin="round" stroke-width="4" style="stroke:var(--hue)"/>',scr:'<rect class="scr" x="16" y="23" width="32" height="21" rx="5"/>',eyes:[[25,31,'d',3.8],[39,31,'d',3.8]],mouth:[32,39.5,3.4]}
};
let gid=0;
function bot(id,mood='idle'){
  const b=BOT[id],g='bg'+(++gid),f=v=>+v.toFixed(1);
  const eye=([x,y,sh,r])=>{
    const open=sh==='c'?`<circle class="eo" cx="${x}" cy="${y}" r="${r}"/>`:sh==='s'?`<rect class="eo" x="${x-r}" y="${y-r}" width="${2*r}" height="${2*r}" rx="1.2"/>`
      :sh==='p'?`<rect class="eo" x="${f(x-r*.75)}" y="${f(y-r*1.3)}" width="${f(r*1.5)}" height="${f(r*2.6)}" rx="${f(r*.75)}"/>`:`<path class="eo" d="M${x} ${y-r}l${r} ${r}-${r} ${r}-${r}-${r}z"/>`;
    const brow=x<31?`M${x-r-.5} ${y-r-1.2}l${2*r+1}-2.6`:x>33?`M${x-r-.5} ${y-r-3.8}l${2*r+1} 2.6`:`M${x-r} ${y-r-2.4}h${2*r}`;
    return open+`<path class="eh" d="M${x-r} ${y+1.2}Q${x} ${f(y-r*1.5)} ${x+r} ${y+1.2}"/><path class="es" d="${brow}"/>`};
  const [mx,my,w]=b.mouth;
  return `<span class="bot" data-mood="${mood}" style="--hue:${AG[id].hue};--bd:-${(RING.indexOf(id)*.83).toFixed(2)}s"><svg viewBox="0 0 64 64" aria-hidden="true">
    <defs><linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:color-mix(in srgb,var(--hue) 68%,#fff)"/><stop offset=".55" style="stop-color:var(--hue)"/><stop offset="1" style="stop-color:color-mix(in srgb,var(--hue) 74%,#000)"/></linearGradient></defs>
    ${b.back||''}<g fill="url(#${g})">${b.head}</g>${b.scr}<g class="eyes">${b.eyes.map(eye).join('')}</g>
    <path class="mo m-flat" d="M${mx-w} ${my}h${2*w}"/><path class="mo m-smile" d="M${mx-w} ${my-1}Q${mx} ${f(my+w*.95)} ${mx+w} ${my-1}"/><path class="mo m-frown" d="M${mx-w} ${my+1.4}Q${mx} ${f(my-w*.8)} ${mx+w} ${my+1.4}"/>
    <g class="m-talk"><rect x="${mx-4.2}" y="${my-2.5}" width="2" height="5" rx="1"/><rect x="${mx-1}" y="${my-2.5}" width="2" height="5" rx="1"/><rect x="${mx+2.2}" y="${my-2.5}" width="2" height="5" rx="1"/></g>${b.front||''}
  </svg></span>`;
}
function type(el,text,sp=13){
  el._tw=(el._tw||0)+1;const my=el._tw;
  if(reduce){el.textContent=text;return}
  el.textContent='';let i=0;(function f(){if(el._tw!==my)return;i+=2;el.textContent=text.slice(0,i);if(i<text.length)setTimeout(f,sp)})();
}
const STOPS={dark:[[91,124,250],[155,107,255],[255,95,162],[255,154,61],[255,226,150]],light:[[61,91,240],[122,69,240],[224,53,138],[240,112,26],[222,150,0]]};
const mkLut=st=>{const o=[];for(let i=0;i<64;i++){const f=i/63*(st.length-1),a=Math.floor(f),b=Math.min(st.length-1,a+1),k=f-a;o.push(st[a].map((v,j)=>Math.round(v+(st[b][j]-v)*k)))}return o};
const LUT={dark:mkLut(STOPS.dark),light:mkLut(STOPS.light)};
/* every visit plays the intro and asks for the code: an old session never skips it */
start();
function start(){
(function gateway(){
  const gate=$('#gate');
  const ic=$('#ic'),g=ic.getContext('2d'),logo=$('#glogo'),cap=$('#gcap'),pin=$('#pin'),msg=$('#gmsg'),ins=[...pin.querySelectorAll('input')];
  $('#gbots').innerHTML=RING.map(id=>bot(id)).join('');
  const gb=[...document.querySelectorAll('#gbots .bot')],gmood=m=>gb.forEach((b,i)=>setTimeout(()=>{b.dataset.mood=m},i*55));
  const sm=(t,a,b)=>{const k=clamp((t-a)/(b-a),0,1);return k*k*(3-2*k)},mix=(a,b,k)=>[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k];
  let W,H,fs,st='intro',t0=0,tg0=0,lastT=0,alive=true,P=[],line=[],sparks=[],rings=[],flash=0,boom=false;
  const gd=Array.from({length:70},()=>({x:Math.random(),y:Math.random(),z:.3+Math.random()*.7,p:Math.random()*6.28}));
  function size(){const d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;ic.width=Math.round(W*d);ic.height=Math.round(H*d);g.setTransform(d,0,0,d,0,0);
    fs=Math.round(Math.min(W*.15,H*.24,170));logo.style.setProperty('--fs',fs+'px')}
  function build(){
    line=[];let v=0;const N=170,raw=[];for(let i=0;i<N;i++){v+=(Math.random()-.46)+(i>N*.82?.7:0);raw.push(v)}
    const lo=Math.min(...raw),hi=Math.max(...raw);for(let i=0;i<N;i++)line.push([W*.06+i/(N-1)*W*.88,H*.62-(raw[i]-lo)/(hi-lo)*H*.26]);
    const o=document.createElement('canvas');o.width=W;o.height=H;const c2=o.getContext('2d',{willReadFrequently:true});c2.fillStyle='#fff';c2.textBaseline='middle';c2.textAlign='center';
    c2.font=`800 ${fs}px "Bricolage Grotesque",system-ui,sans-serif`;try{c2.letterSpacing=(-.045*fs)+'px'}catch(e){}
    c2.fillText('BackStage',W/2,H/2-.16*fs);try{c2.letterSpacing='0px'}catch(e){}
    const f2=fs*.3;c2.font=`500 ${f2}px "Bricolage Grotesque",system-ui,sans-serif`;c2.textAlign='left';
    const ch=[...'Capital'],ws=ch.map(q=>c2.measureText(q).width),tot=ws.reduce((a,b)=>a+b,0)+f2*.5*(ch.length-1);let x=W/2-tot/2;
    ch.forEach((q,i)=>{c2.fillText(q,x,H/2+.56*fs);x+=ws[i]+f2*.5});
    const d=c2.getImageData(0,0,W,H).data,pts=[],gap=Math.max(2,Math.round(fs/40));
    for(let y=0;y<H;y+=gap)for(let x=0;x<W;x+=gap)if(d[(y*W+x)*4+3]>128)pts.push([x,y]);
    const keep=Math.min(1,3800/pts.length);let lox=1e9,hix=0;const sel=pts.filter(()=>Math.random()<keep);sel.forEach(q=>{lox=Math.min(lox,q[0]);hix=Math.max(hix,q[0])});
    P=sel.map(([tx,ty])=>{const k=(tx-lox)/(hix-lox||1);return{x:0,y:0,vx:0,vy:0,tx,ty,d:k*.9+Math.random()*.25,b:Math.min(15,Math.floor(k*16)),ph:Math.random()*6.28}}).sort((a,b)=>a.b-b.b);
  }
  function beam(ox,oy,p,rgb,a){
    const dx=p[0]-ox,dy=p[1]-oy,L=Math.hypot(dx,dy),nx=dx/L,ny=dy/L,len=L*1.3,ex=ox+nx*len,ey=oy+ny*len;
    [[.2,.07],[.1,.11]].forEach(([sp,al])=>{const gr=g.createLinearGradient(ox,oy,ex,ey);gr.addColorStop(0,rgba(rgb,al*a*1.6));gr.addColorStop(.75,rgba(rgb,al*a*.5));gr.addColorStop(1,rgba(rgb,0));
      g.fillStyle=gr;g.beginPath();g.moveTo(ox,oy);g.lineTo(ex-ny*len*sp,ey+nx*len*sp);g.lineTo(ex+ny*len*sp,ey-nx*len*sp);g.fill()});
    g.save();g.translate(p[0],p[1]);g.scale(1,.34);const pr=g.createRadialGradient(0,0,0,0,0,L*.34);pr.addColorStop(0,rgba(rgb,.16*a));pr.addColorStop(1,rgba(rgb,0));g.fillStyle=pr;g.beginPath();g.arc(0,0,L*.34,0,7);g.fill();g.restore();
  }
  function draw(t,dt){
    const gt=st==='gate';
    g.globalCompositeOperation='source-over';g.globalAlpha=1;g.fillStyle='#04060C';g.fillRect(0,0,W,H);
    const amb=gt?1:sm(t,2.4,4.6);
    if(amb>0){const r=g.createRadialGradient(W/2,H*.5,0,W/2,H*.5,Math.max(W,H)*.7);r.addColorStop(0,`rgba(26,34,80,${.6*amb})`);r.addColorStop(1,'rgba(4,6,12,0)');g.fillStyle=r;g.fillRect(0,0,W,H)}
    g.globalCompositeOperation='lighter';
    gd.forEach(d=>{const x=((d.x+t*.006*d.z)%1)*W,y=((d.y+Math.sin(t*.25+d.p)*.006-t*.004*d.z)%1+1)%1*H;g.fillStyle=`rgba(255,240,220,${(.1+.25*amb)*d.z*(.6+.4*Math.sin(t*1.4+d.p))})`;g.beginPath();g.arc(x,y,d.z*1.4,0,7);g.fill()});
    const si=gt?.55:sm(t,2.7,3.9);
    if(si>0){const k=gt?1:sm(t,5.2,7.3),c=[W/2,gt?H*.47:H*.5];
      beam(W*.1,-40,mix([W*(.3+.22*Math.sin(t*1.25)),H*.64],c,k),[255,210,160],si);beam(W*.9,-40,mix([W*(.7+.22*Math.sin(t*1.05+2)),H*.64],c,k),[165,182,255],si)}
    /* scene one: the market line */
    if(!gt&&t<2.9&&line.length){const k=clamp(t/2.3,0,1),n=Math.max(2,Math.floor((1-Math.pow(1-k,2.2))*line.length)),al=1-sm(t,2.5,2.75);
      g.globalAlpha=al;for(let i=1;i<6;i++){g.strokeStyle='rgba(255,255,255,.05)';g.lineWidth=1;g.beginPath();g.moveTo(0,H*(.3+i*.07));g.lineTo(W,H*(.3+i*.07));g.stroke()}
      const gr=g.createLinearGradient(W*.06,0,W*.94,0);gr.addColorStop(0,'#5B7CFA');gr.addColorStop(.4,'#9B6BFF');gr.addColorStop(.7,'#FF5FA2');gr.addColorStop(1,'#FF9A3D');
      g.beginPath();g.moveTo(line[0][0],line[0][1]);for(let i=1;i<n;i++)g.lineTo(line[i][0],line[i][1]);
      g.strokeStyle=gr;g.lineWidth=2.6;g.lineJoin='round';g.shadowColor='#FF5FA2';g.shadowBlur=24;g.stroke();g.shadowBlur=0;
      const h=line[n-1];g.lineTo(h[0],H*.9);g.lineTo(line[0][0],H*.9);const ar=g.createLinearGradient(0,H*.36,0,H*.9);ar.addColorStop(0,'rgba(155,107,255,.16)');ar.addColorStop(1,'rgba(155,107,255,0)');g.fillStyle=ar;g.fill();
      const hg=g.createRadialGradient(h[0],h[1],0,h[0],h[1],34);hg.addColorStop(0,'rgba(255,255,255,.9)');hg.addColorStop(.25,'rgba(255,154,61,.5)');hg.addColorStop(1,'rgba(255,154,61,0)');g.fillStyle=hg;g.beginPath();g.arc(h[0],h[1],34,0,7);g.fill();
      if(k<1)for(let i=0;i<2;i++)sparks.push({x:h[0],y:h[1],vx:-40-Math.random()*180,vy:(Math.random()-.5)*220,l:1});
      g.globalAlpha=1}
    for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.l-=dt*1.8;if(s.l<=0){sparks.splice(i,1);continue}s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=180*dt;g.fillStyle=`rgba(255,190,120,${s.l})`;g.fillRect(s.x,s.y,2,2)}
    /* scene two and three: the line shatters, then gathers into the name */
    if(!gt&&t>=2.6&&!boom&&P.length){boom=true;flash=.55;P.forEach(p=>{const q=line[Math.floor(Math.random()*line.length)],a=Math.random()*6.283,sp=60+Math.random()*Math.random()*620;p.x=q[0];p.y=q[1];p.vx=Math.cos(a)*sp;p.vy=Math.sin(a)*sp-80})}
    if(boom&&P.length){const fall=gt?(performance.now()-tg0)/1000:0,cx=W/2,cy=H/2;
      if(fall>1.1)P=[];else{g.globalAlpha=gt?1-sm(fall,0,1):t>7.5?1-.55*sm(t,7.5,8.4):.9;let lb=-1;const sz=Math.max(1.5,fs/75);
        for(let i=0;i<P.length;i++){const p=P[i];
          if(gt){p.vy+=900*dt;p.vx*=.99}
          else if(t<5.2+p.d){p.vx+=(-(p.y-cy)*.9-(p.x-cx)*.25)*dt;p.vy+=((p.x-cx)*.9-(p.y-cy)*.25)*dt;p.vx*=.986;p.vy*=.986}
          else{p.vx+=((p.tx-p.x)*30-p.vx*8.5)*dt;p.vy+=((p.ty-p.y)*30-p.vy*8.5)*dt}
          p.x+=p.vx*dt;p.y+=p.vy*dt;
          if(p.b!==lb){lb=p.b;g.fillStyle=rgba(LUT.dark[4+p.b*3],1)}
          const j=t>7.4&&!gt?Math.sin(t*3+p.ph)*.5:0;g.fillRect(p.x+j-sz/2,p.y-sz/2,sz,sz)}
        g.globalAlpha=1}}
    for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.r+=dt*900;r.a-=dt*.9;if(r.a<=0){rings.splice(i,1);continue}g.strokeStyle=`rgba(255,190,130,${r.a*.7})`;g.lineWidth=3*r.a+.5;g.beginPath();g.arc(W/2,H/2,r.r,0,7);g.stroke()}
    if(flash>.01){g.fillStyle=`rgba(255,235,215,${flash})`;g.fillRect(0,0,W,H);flash*=Math.pow(.004,dt)}
  }
  const EV=[[.5,()=>type(cap,'Every market has a front stage.',26)],[1.4,()=>$('#gskip').classList.add('on')],[3.1,()=>type(cap,'The real decisions are made behind it.',26)],[5.5,()=>{cap.style.opacity=0}],
    [7.45,()=>{rings.push({r:fs*.6,a:1},{r:fs*.2,a:.8});flash=.3;logo.classList.add('on')}],[8.9,()=>logo.classList.add('tl')],[11.6,()=>toGate()]];let ei=0;
  function toGate(){
    if(st!=='intro')return;st='gate';tg0=performance.now();if(!boom)P=[];cap.style.opacity=0;logo.classList.add('on');gate.classList.add('locked');
    if(matchMedia('(pointer:fine)').matches)setTimeout(()=>{if(st==='gate'&&!ins.some(e=>e.value)&&!ins.includes(document.activeElement))ins[0].focus()},1500);
  }
  function loop(now){
    if(!alive)return;if(!t0){t0=now;lastT=now}const t=(now-t0)/1000,dt=Math.min(.05,(now-lastT)/1000);lastT=now;
    while(st==='intro'&&ei<EV.length&&t>=EV[ei][0])EV[ei++][1]();
    draw(t,dt);requestAnimationFrame(loop);
  }
  $('#gskip').onclick=toGate;
  addEventListener('resize',()=>{if(!alive)return;size();if(st==='intro'&&!boom)build()});
  /* the code */
  const val=()=>ins.map(e=>e.value).join('');
  let busy=false;
  async function check(){const v=val();if(v.length<6||busy)return;busy=true;
    try{const r=await fetch('/api/unlock',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:v})});
      if(r.ok)unlock();else if(r.status===429)showTooManyAttempts();else deny()}
    catch(e){busy=false;deny('Could not reach the desk. Try again.')}}
  function deny(text){pin.classList.add('no');msg.textContent=text||'Not on the list. Try again.';msg.className='g-msg no';gmood('bear');
    setTimeout(()=>{pin.classList.remove('no');ins.forEach(e=>{e.value=''});busy=false;ins[0].focus();gmood('idle')},900)}
  function showTooManyAttempts(){pin.classList.add('no');ins.forEach(e=>{e.value='';e.disabled=true});msg.textContent='Too many attempts. Try again in 15 minutes.';msg.className='g-msg no';gmood('bear');
    setTimeout(()=>{pin.classList.remove('no');ins.forEach(e=>{e.disabled=false});busy=false},15*60e3)}
  function unlock(){
    st='open';ins.forEach((e,i)=>{e.disabled=true;setTimeout(()=>e.classList.add('ok'),i*90)});msg.textContent='Welcome backstage.';msg.className='g-msg ok';gmood('bull');flash=.18;
    setTimeout(()=>{gate.style.setProperty('--ix',innerWidth/2+'px');gate.style.setProperty('--iy',innerHeight*.5+'px');gate.classList.add('open');
      setTimeout(()=>{alive=false;location.assign('/room')},1700)},1250);
  }
  ins.forEach((el,i)=>{
    el.addEventListener('input',()=>{el.value=el.value.replace(/\D/g,'').slice(-1);if(el.value&&i<5)ins[i+1].focus();check()});
    el.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!el.value&&i>0){ins[i-1].value='';ins[i-1].focus();e.preventDefault()}});
    el.addEventListener('paste',e=>{e.preventDefault();const d=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,6);[...d].forEach((q,k)=>{ins[k].value=q});(ins[Math.min(5,d.length)]||ins[5]).focus();check()});
  });
  $('#gcard').onsubmit=e=>{e.preventDefault();check()};
  /* start */
  size();
  if(reduce){logo.classList.add('on');toGate();draw(20,0);return}
  Promise.race([document.fonts.load('800 80px "Bricolage Grotesque"'),new Promise(r=>setTimeout(r,1800))]).then(()=>{size();build();requestAnimationFrame(loop)});
})();
}
})();
